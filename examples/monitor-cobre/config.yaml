# Configuración del monitor de cobre.
# Los valores marcados AJUSTAR son estimados: reemplázalos con tus cotizaciones reales.

apariencia:
  tema: noche   # cobre | noche | corporativo | minimal

empresa:
  proveedor_actual: peru          # clave de la lista de proveedores de abajo
  inventario_toneladas: 120       # AJUSTAR: cobre en bodega hoy
  consumo_mensual_toneladas: 80   # AJUSTAR: consumo promedio de la planta
  cobertura_minima_dias: 30       # alerta si el inventario alcanza para menos días
  puerto_llegada: Buenaventura
  ciudad_planta: Cali

# Costo puesto en planta = (cobre USD/t + prima + flete + seguro) x TRM x (1 + arancel)
# Todos los montos en USD por tonelada métrica.
proveedores:
  peru:                   # clave interna (no cambiar: la usan tus Secrets)
    nombre: "Elcope (Perú, vía Callao)"
    prima_usd_t: 120      # AJUSTAR: prima sobre LME/COMEX que te cobra el proveedor
    flete_usd_t: 85       # AJUSTAR: flete marítimo + puerto + transporte interno
    seguro_usd_t: 10      # AJUSTAR
    arancel_pct: 0.0      # CAN (Comunidad Andina): 0 % para cátodo de cobre (verificar con tu agente de aduana)
    dias_transito: 12
  chile:
    nombre: "Chile (cátodo, vía San Antonio)"
    prima_usd_t: 135      # AJUSTAR
    flete_usd_t: 110      # AJUSTAR
    seguro_usd_t: 10      # AJUSTAR
    arancel_pct: 0.0      # TLC Colombia-Chile (verificar)
    dias_transito: 18
  mexico:
    nombre: "México"
    prima_usd_t: 150      # AJUSTAR
    flete_usd_t: 140      # AJUSTAR
    seguro_usd_t: 12      # AJUSTAR
    arancel_pct: 0.0      # verificar
    dias_transito: 20

# Precio del cobre.
# fuente "comex": futuro HG=F (Nueva York, ~15 min de retraso), se aproxima a la LME.
# precio_manual_usd_t: si tu broker te da el precio LME oficial, ponlo aquí y se usa en lugar de COMEX.
cobre:
  fuente: comex
  precio_manual_usd_t: null

alertas:
  cobre_baja_semanal_pct: -3.0    # oportunidad de compra
  cobre_sube_semanal_pct: 5.0     # subida fuerte: considerar adelantar compra/cobertura
  trm_variacion_semanal_pct: 2.0  # movimiento fuerte del dólar
  noticia_riesgo_minimo: 6        # puntaje desde el que una noticia genera alerta
  ahorro_minimo_cambio_proveedor_pct: 2.0  # alerta si otro proveedor es al menos X % más barato

noticias:
  max_horas: 72          # noticias de los últimos 3 días
  verificar_fechas: true # abre la página de las noticias de nivel Medio o más para leer su fecha real de publicación
  # Nombres de tu proveedor directo: cualquier noticia que lo mencione sube de nivel.
  proveedor_claves:
    - "Elcope"
    - "Electro Conductores Peruanos"
    - "Electroconductores Peruanos"
  google_news:           # búsquedas en español (Perú)
    - "Elcope"
    - "Electro Conductores Peruanos"
    - "cobre Perú"
    - "minería Perú huelga OR paro OR bloqueo"
    - "Las Bambas"
    - "corredor minero sur"
    - "Cerro Verde OR Antamina OR Quellaveco"
    - "puerto Callao paro OR huelga"
    - "precio del cobre"
    - "Cochilco cobre"
  google_news_colombia:  # búsquedas en Colombia: ruta Buenaventura - Cali, dólar, aduana
    - "Buenaventura puerto"
    - "Buenaventura paro OR bloqueo"
    - "vía Buenaventura Cali"
    - "paro camionero Colombia"
    - "dólar Colombia"
    - "Banco de la República tasas"
    - "DIAN importaciones aranceles"
    - "cobre Colombia"
  google_news_mundo:     # búsquedas en español sobre el resto del mundo
    - "Codelco producción cobre"
    - "Chile cobre huelga"
    - "aranceles cobre Estados Unidos"
    - "China demanda cobre"
    - "Canal de Panamá"
  google_news_en:        # búsquedas en inglés (mercado mundial)
    - "copper price LME"
    - "copper price record"
    - "Peru copper mine"
    - "copper mine strike"
    - "copper smelter"
    - "copper supply disruption"
    - "copper force majeure"
    - "copper tariffs"
    - "China copper demand"
    - "Chile copper production"
    - "Congo copper"
    - "Panama Canal shipping"
    - "container shipping rates"
    - "dollar Federal Reserve rates"
  # Feeds RSS de medios u organismos, leídos directamente (además de Google News). Formato:
  #   - nombre: "Nombre del medio"
  #     url: "https://.../rss"
  # Antes de dejar uno fijo, revisa en la pestaña Noticias → "Estado de las fuentes" que traiga noticias.
  rss_directos: []
  gdelt:
    - '(copper OR cobre) (strike OR huelga OR blockade OR bloqueo OR "force majeure" OR shortage OR tariff OR arancel)'
